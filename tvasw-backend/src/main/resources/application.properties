# Gemini configuration
gemini.api.key=
gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent

# Datasource: using H2 for development by default
spring.datasource.url=jdbc:h2:mem:tvaswdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.application.name=tvasw-backend

# JWT Configuration (set TVASW_APP_JWTSECRET; a random key is used per start if empty)
tvasw.app.jwtSecret=
tvasw.app.jwtExpirationMs=86400000

# Spring AI Configuration (Google Gemini)
# (disabled for local stub or replace with real key in production)
spring.ai.google.genai.api-key=

# Logging
logging.level.org.springframework.security=DEBUG

# Rate limits
tvasw.limits.ai-per-minute=10
tvasw.limits.ai-per-day=100
tvasw.limits.ai-global-per-day=1000
tvasw.limits.login-per-15-minutes=10
tvasw.limits.register-per-hour=5
